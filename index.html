<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>James' Step Count</title>
    <link rel="stylesheet" type="text/css" href="/styles.css">
    
    <meta name="robots" content="noindex">
</head>
<body>
    <main>
        <div class="month-current">
            <div id="current-month-container"></div>
        </div>            
        <div class="month-archives">
            <p>
                <span style="opacity: 0.5" id="last-updated"></span>
                (<a href="https://github.com/jamesgwyer/steps" target="_blank">Github</a>)
            </p>
            <details style="cursor: pointer">
                <summary>Show previous months</summary>
                <div id="archive-container"></div>
            </details>
        </div>
    </main>
    <script src="calendar.js"></script>
</body>
</html>
